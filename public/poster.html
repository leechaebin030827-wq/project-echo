<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT ECHO Poster</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050505; }
  body { font-family: Helvetica, Arial, sans-serif; }
  .poster { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050505; color: white; }
  .panel { position: absolute; top: 0; bottom: 168px; background-position: center; background-size: cover; filter: grayscale(1) contrast(1.12); }
  .nevada { left: 0; width: 1010px; background-image: url('/ending/ending-2.png'); clip-path: polygon(0 0, 100% 0, 80.7% 100%, 0 100%); }
  .hamina { left: 790px; width: 815px; background-image: url('/ending/ending-1.png'); clip-path: polygon(24% 0, 100% 0, 88% 100%, 0 100%); }
  .pacific { left: 1484px; width: 436px; background-image: url('/ending/ending-5.png'); clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%); }
  .shade { position: absolute; inset: 0 0 168px; background: linear-gradient(90deg, rgba(0,0,0,.6), rgba(0,0,0,.12) 44%, rgba(0,0,0,.2)); }
  .cut { position: absolute; top: 0; bottom: 168px; width: 2px; background: rgba(255,255,255,.82); transform-origin: top; }
  .cut.one { left: 1009px; transform: rotate(12deg); }
  .cut.two { left: 1604px; transform: rotate(6deg); }
  .echo { position: absolute; left: 1420px; top: 135px; width: 400px; height: 325px; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: url('/../artifacts/qa/echo-sky-spin-close.png') center 46% / 312% auto no-repeat; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .title { position: absolute; left: 88px; top: 174px; z-index: 2; }
  .project { font-size: 34px; font-weight: 600; letter-spacing: 15px; margin: 0 0 0 4px; }
  .echo-word { font-size: 218px; line-height: .83; font-weight: 900; letter-spacing: -8px; margin-top: 8px; }
  .question { margin: 55px 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: 1.8px; }
  .index { position: absolute; bottom: 220px; z-index: 2; font-size: 16px; font-weight: 800; letter-spacing: 2px; }
  .i1 { left: 670px; } .i2 { left: 1350px; } .i3 { right: 80px; }
  footer { position: absolute; left: 0; right: 0; bottom: 0; height: 168px; padding: 59px 96px 0; background: rgba(5,5,5,.9) url('/ending/ending-3.png') center 58% / cover no-repeat; background-blend-mode: multiply; }
  footer strong { display: block; font-size: 18px; letter-spacing: 4px; }
  footer span { display: block; margin-top: 18px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.72); letter-spacing: 1.6px; }
</style>
</head>
<body>
  <main class="poster">
    <div class="panel nevada"></div><div class="panel hamina"></div><div class="panel pacific"></div>
    <div class="shade"></div><div class="cut one"></div><div class="cut two"></div><div class="echo"></div>
    <section class="title"><p class="project">PROJECT</p><div class="echo-word">ECHO</div><p class="question">WHO OWNS THE MEMORY AFTER IT ENTERS THE CLOUD?</p></section>
    <span class="index i1">01</span><span class="index i2">02</span><span class="index i3">03</span>
    <footer><strong>NEVADA&nbsp;&nbsp;/&nbsp;&nbsp;PACIFIC OCEAN&nbsp;&nbsp;/&nbsp;&nbsp;HAMINA</strong><span>AN INTERACTIVE JOURNEY THROUGH DATA, MEMORY, AND INFRASTRUCTURE</span></footer>
  </main>
</body>
</html>
