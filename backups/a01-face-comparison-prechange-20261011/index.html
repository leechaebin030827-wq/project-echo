<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="description" content="한 사람의 얼굴이 반복되는 Nevada의 ECHO World" />
    <title>ECHO — Nevada</title>
    <script>
      if (window.location.protocol === 'file:') {
        window.location.replace('http://127.0.0.1:5176/');
      }
    </script>
  </head>
  <body>
    <main class="app-shell" aria-label="ECHO Nevada experience">
      <section id="stage" class="stage" aria-live="polite">
        <canvas id="world-canvas" class="world-canvas" aria-label="Nevada ECHO World"></canvas>

        <section id="intro-root" class="intro-root" aria-label="Project ECHO introduction"></section>

        <div id="capture-layer" class="capture-layer" hidden>
          <header class="capture-heading">
            <span class="eyebrow">PROJECT ECHO / NEVADA</span>
            <h1>FACE THE ECHO</h1>
          </header>

          <div class="camera-frame">
            <video id="face-camera" muted playsinline></video>
            <img id="photo-preview" alt="촬영한 얼굴 미리보기" hidden />
            <div class="camera-vignette" aria-hidden="true"></div>
          </div>

          <p id="face-status" class="face-status">카메라를 준비하고 있습니다</p>

          <div id="capture-actions" class="capture-actions">
            <button id="capture-button" class="round-button" type="button" aria-label="사진 촬영">
              <span></span>
            </button>
            <div id="preview-actions" class="preview-actions" hidden>
              <button id="retake-button" type="button">RETAKE</button>
              <button id="use-button" class="primary" type="button">USE PHOTO</button>
            </div>
          </div>
        </div>

        <div id="world-loading" class="world-loading" hidden>
          <span></span>
          <p>ECHO에 연결하는 중</p>
        </div>

        <section id="world-entry-overlay" class="world-entry-overlay" aria-hidden="true">
          <div class="world-entry-design">
            <div class="world-entry-copy">
              <p>프로젝트 에코가 클라우드 너머에서</p>
              <p>당신의 존재를 발견한 곳입니다.</p>
            </div>
            <img class="world-entry-vector world-entry-vector--0" src="/world-entry/vector-0.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--1" src="/world-entry/vector-1.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--2" src="/world-entry/vector-2.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--3" src="/world-entry/vector-3.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--4" src="/world-entry/vector-4.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--5" src="/world-entry/vector-5.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--6" src="/world-entry/vector-6.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--7" src="/world-entry/vector-7.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--8" src="/world-entry/vector-8.svg" alt="" />
            <img class="world-entry-vector world-entry-vector--9" src="/world-entry/vector-9.svg" alt="" />
          </div>
        </section>

        <section id="hamina-entry-overlay" class="world-entry-overlay hamina-entry-overlay" aria-hidden="true">
          <div class="world-entry-design hamina-entry-design">
            <div class="world-entry-copy">
              <p>프로젝트 에코가 클라우드 너머에서</p>
              <p>당신의 존재를 발견한 곳입니다.</p>
            </div>
            <img class="hamina-entry-vector hamina-entry-vector--0" src="/hamina-entry/vector-0.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--1" src="/hamina-entry/vector-1.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--2" src="/hamina-entry/vector-2.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--3" src="/hamina-entry/vector-3.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--4" src="/hamina-entry/vector-4.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--5" src="/hamina-entry/vector-5.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--6" src="/hamina-entry/vector-6.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--7" src="/hamina-entry/vector-7.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--8" src="/hamina-entry/vector-8.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--9" src="/hamina-entry/vector-9.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--10" src="/hamina-entry/vector-10.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--11" src="/hamina-entry/vector-11.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--12" src="/hamina-entry/vector-12.svg" alt="" />
            <img class="hamina-entry-vector hamina-entry-vector--13" src="/hamina-entry/vector-13.svg" alt="" />
          </div>
        </section>

        <section id="world-jump-overlay" class="world-jump-overlay" aria-hidden="true">
          <canvas class="world-jump-snapshot" aria-hidden="true"></canvas>
          <div class="world-jump-grid" aria-hidden="true"></div>
        </section>

        <section id="echo-caption" class="echo-caption" aria-hidden="true" aria-live="polite">
          <p class="echo-caption-korean">여기 당신의 당신이 살고 있네요</p>
          <p class="echo-caption-english">Here, another you is living.</p>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
