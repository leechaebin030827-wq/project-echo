<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="description" content="한 사람의 얼굴이 반복되는 Nevada의 ECHO World" />
    <title>PROJECT ECHO</title>
    <script>
      if (window.location.protocol === 'file:') {
        window.location.replace('http://127.0.0.1:5176/');
      }
    </script>
  </head>
  <body>
    <main class="app-shell" aria-label="ECHO Nevada experience">
      <section id="stage" class="stage" aria-live="polite">
        <canvas id="world-canvas" class="world-canvas" aria-label="Nevada ECHO World"></canvas>

        <section id="intro-root" class="intro-root" aria-label="Project ECHO introduction"></section>

        <div id="capture-layer" class="capture-layer" hidden>
          <header class="capture-heading">
            <span class="eyebrow">PROJECT ECHO / NEVADA</span>
            <h1>FACE THE ECHO</h1>
          </header>

          <div class="camera-frame">
            <video id="face-camera" muted playsinline></video>
            <img id="photo-preview" alt="촬영한 얼굴 미리보기" hidden />
            <div class="camera-vignette" aria-hidden="true"></div>
          </div>

          <p id="face-status" class="face-status">카메라를 준비하고 있습니다</p>

          <div id="capture-actions" class="capture-actions">
            <button id="capture-button" class="round-button" type="button" aria-label="사진 촬영">
              <span></span>
            </button>
            <div id="preview-actions" class="preview-actions" hidden>
              <button id="retake-button" type="button">RETAKE</button>
              <button id="use-button" class="primary" type="button">USE PHOTO</button>
            </div>
          </div>
        </div>

        <div id="world-loading" class="world-loading" hidden>
          <span></span>
          <p>ECHO에 연결하는 중</p>
        </div>

        <section id="world-entry-overlay" class="world-entry-overlay" aria-hidden="true">
          <div class="world-entry-design">
            <div class="world-entry-copy">
              <p>프로젝트 에코가 클라우드 너머에서</p>
              <p>당신의 흔적을 감지한 곳입니다.</p>
            </div>
            <div class="world-entry-word world-entry-word--nevada"><span>NEVADA,</span></div>
            <div class="world-entry-word world-entry-word--usa"><span>USA</span></div>
          </div>
        </section>

        <section id="hamina-entry-overlay" class="world-entry-overlay hamina-entry-overlay" aria-hidden="true">
          <div class="world-entry-design hamina-entry-design">
            <div class="world-entry-copy">
              <p>프로젝트 에코가 클라우드 너머에서</p>
              <p>당신의 흔적을 감지한 곳입니다.</p>
            </div>
            <div class="world-entry-word world-entry-word--hamina"><span>HAMINA,</span></div>
            <div class="world-entry-word world-entry-word--finland"><span>Finland</span></div>
          </div>
        </section>

        <section id="world-jump-overlay" class="world-jump-overlay" aria-hidden="true">
          <canvas class="world-jump-snapshot" aria-hidden="true"></canvas>
          <div class="world-jump-grid" aria-hidden="true"></div>
        </section>

        <section id="echo-caption" class="echo-caption" aria-hidden="true" aria-live="polite">
          <p class="echo-caption-korean">클라우드 너머, 이곳에서 당신을 목격했어요.</p>
          <p class="echo-caption-english">Beyond the cloud, I saw you here.</p>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
